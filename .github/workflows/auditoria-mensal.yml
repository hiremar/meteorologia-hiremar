name: Fechamento mensal (REDEMET + auditoria + indicadores + dashboard)

# Roda nos dias 1 a 5 de cada mês, duas vezes por dia. Por quê tantas vezes?
#  - o GitHub às vezes DESCARTA agendamentos (em 02/10/2026 o do dia 2 não rodou);
#  - cada rodada refaz tudo do mês anterior com os dados mais completos;
#  - é seguro repetir: o que VOCÊ editou à mão (auditoria, células da planilha
#    de Indicadores) não é sobrescrito, e o valor do DECEA nunca é trocado pelo
#    da REDEMET.
on:
  schedule:
    - cron: '37 9 1-5 * *'    # 06:37 no Brasil
    - cron: '47 15 1-5 * *'   # 12:47 no Brasil
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês (AAAA-MM). Vazio = mês anterior'
        required: false
        default: ''
      forcar:
        description: 'Forçar: refaz e sobrescreve até o que foi editado à mão'
        type: boolean
        required: false
        default: false

concurrency:
  group: drive-fab
  cancel-in-progress: false

jobs:
  fechar-mes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      REDEMET_KEY: ${{ secrets.REDEMET_KEY }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      INDICADORES_FOLDER_ID: ${{ secrets.INDICADORES_FOLDER_ID }}
      MES: ${{ github.event.inputs.mes }}
      FORCAR: ${{ github.event.inputs.forcar == 'true' && '--forcar' || '' }}
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl xlsxwriter google-api-python-client google-auth pdfplumber

      - name: 1) REDEMET - completar o mês, atrasos/ausências e SBSP AUTOMETAR
        run: python mensal_redemet.py ${MES:+--mes "$MES"} $FORCAR

      - name: 2) Auditoria de consistência
        run: python auditoria_metar.py ${MES:+--mes "$MES"} $FORCAR

      - name: 3) Planilha de Indicadores (D, E provisório, F)
        run: python atualizar_indicadores_drive.py ${MES:+--mes "$MES"} $FORCAR

      - name: 4) Relatório do DECEA (se já chegou algum PDF novo)
        run: python decea_relatorio.py --sem-dashboard

      - name: 5) Dashboard HTML
        run: python gerar_dashboard.py
