name: Auditoria mensal METAR/SPECI -> Google Drive

on:
  schedule:
    # Dia 2 de cada mês, 12:00 UTC (09:00 no Brasil) -> audita o mês anterior
    - cron: '0 12 2 * *'
  # Execução manual; opcionalmente informe o mês (AAAA-MM), ex.: 2026-09
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês a auditar (AAAA-MM). Vazio = mês anterior'
        required: false
        default: ''

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter google-api-python-client google-auth

      - name: Executar auditoria
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MES: ${{ github.event.inputs.mes }}
        run: |
          if [ -n "$MES" ]; then
            python auditoria_metar.py --mes "$MES"
          else
            python auditoria_metar.py
          fi
