name: Automacao METAR REDEMET -> Google Drive

on:
  schedule:
    # Roda diariamente às 06:00 UTC (03:00 da manhã no Brasil)
    - cron: '0 6 * * *'
  # Permite executar manualmente a qualquer momento
  workflow_dispatch:

jobs:
  executar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl xlsxwriter google-api-python-client google-auth

      - name: Executar Script Python
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python script_opmet.py
