name: Automacao METAR REDEMET -> Google Drive

on:
  schedule:
    # Todo dia ~06:23 UTC (03:23 no Brasil). Minuto "quebrado" de propósito:
    # o GitHub atrasa/descarta mais os agendamentos marcados em hora cheia.
    - cron: '23 6 * * *'
  workflow_dispatch:

# Um robô por vez mexendo no Drive (evita dois salvarem a mesma planilha juntos)
concurrency:
  group: drive-fab
  cancel-in-progress: false

jobs:
  executar-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl xlsxwriter google-api-python-client google-auth

      - name: Executar Script Python
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          REDEMET_KEY: ${{ secrets.REDEMET_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python script_opmet.py
