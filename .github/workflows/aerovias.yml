name: Copia semanal das aerovias (GEOAISWEB)

on:
  schedule:
    # Toda segunda ~09:17 UTC. Minuto "quebrado" de propósito (o GitHub atrasa os de hora cheia).
    - cron: '17 9 * * 1'
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write           # o robô precisa salvar (commit) a cópia no repositório

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas
        run: pip install requests

      - name: Baixar as aerovias
        id: baixar
        continue-on-error: true           # GEOAISWEB fora do ar: salva o que conseguiu e segue
        run: python atualizar_aerovias.py

      - name: Salvar a cópia no repositório (só se mudou)
        run: |
          git config user.name "robo-aerovias"
          git config user.email "robo-aerovias@users.noreply.github.com"
          git add dados/aerovias_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada mudou nas aerovias."
          else
            git commit -m "Cópia semanal das aerovias do GEOAISWEB"
            git push
          fi
